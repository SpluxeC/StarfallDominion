name: Publish Starfall browser clients
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout browser clients
        uses: actions/checkout@v4
      - name: Prepare static playtest
        run: |
          mkdir -p public/multiplayer
          cp index.html public/index.html
          cp multiplayer/index.html public/multiplayer/index.html
          cp multiplayer/planet3d.js public/multiplayer/planet3d.js
          test -s public/multiplayer/planet3d.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy both browser games
        id: deployment
        uses: actions/deploy-pages@v4
