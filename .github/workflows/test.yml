name: Starfall Dominion gameplay and multiplayer tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local RTS smoke tests
        run: node tests/smoke.cjs
      - name: Experimental snapshot relay tests
        run: node --test tests/rooms.test.cjs
      - name: Authoritative multiplayer integration tests
        run: node --test tests/multiplayer.test.cjs
