services:
  galaxy:
    build:
      context: .
      dockerfile: multiplayer/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      NODE_ENV: production
      PORT: "8788"
      STARFALL_DATA_PATH: /data/galaxy.json
      STARFALL_INVITE_CODE: ${STARFALL_INVITE_CODE:?Set a secret invitation code in your .env file}
      ALLOWED_ORIGINS: "https://spluxec.github.io"
    volumes:
      - galaxy-data:/data
volumes:
  galaxy-data:
